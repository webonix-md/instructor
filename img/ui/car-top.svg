<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 80">
  <!-- Машина сверху, капот смотрит вниз (едет вниз по странице). Цвет — как у его синей Fabia -->
  <g fill="#10151d">
    <rect x="3" y="13" width="5" height="11" rx="2"/>
    <rect x="32" y="13" width="5" height="11" rx="2"/>
    <rect x="3" y="55" width="5" height="11" rx="2"/>
    <rect x="32" y="55" width="5" height="11" rx="2"/>
  </g>
  <!-- зеркала -->
  <g fill="#1E46C4">
    <ellipse cx="4.5" cy="47" rx="2.6" ry="1.8"/>
    <ellipse cx="35.5" cy="47" rx="2.6" ry="1.8"/>
  </g>
  <!-- кузов -->
  <rect x="5" y="3" width="30" height="74" rx="11" fill="#2552D9"/>
  <!-- блик по бокам -->
  <rect x="7" y="8" width="3" height="62" rx="1.5" fill="#fff" opacity=".12"/>
  <!-- заднее стекло -->
  <path d="M9.5 15 H30.5 L28.5 23 H11.5 Z" fill="#0d1626"/>
  <!-- крыша -->
  <rect x="11" y="23" width="18" height="22" rx="3" fill="#3A68EE"/>
  <!-- боковые стёкла -->
  <rect x="8.6" y="23.5" width="1.9" height="21" rx=".9" fill="#0d1626"/>
  <rect x="29.5" y="23.5" width="1.9" height="21" rx=".9" fill="#0d1626"/>
  <!-- лобовое стекло -->
  <path d="M11.5 45 H28.5 L31.5 55.5 H8.5 Z" fill="#0d1626"/>
  <path d="M13 46.5 H20 L18 54 H11 Z" fill="#fff" opacity=".14"/>
  <!-- линии капота -->
  <path d="M14 59 Q20 61 26 59" stroke="#1B3FAF" stroke-width="1" fill="none"/>
  <!-- фары и фонари -->
  <rect x="8" y="71.5" width="7.5" height="3" rx="1.5" fill="#FFF3C4"/>
  <rect x="24.5" y="71.5" width="7.5" height="3" rx="1.5" fill="#FFF3C4"/>
  <rect x="8" y="4.6" width="6.5" height="2.4" rx="1.2" fill="#E5383B"/>
  <rect x="25.5" y="4.6" width="6.5" height="2.4" rx="1.2" fill="#E5383B"/>
</svg>
